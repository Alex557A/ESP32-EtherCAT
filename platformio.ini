[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Настройки для ESP32-S3 (как в рабочем проекте)
board_build.flash_size = 16MB
board_build.psram_type = qspi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUHAL_LOG_LEVEL=0
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
    -fno-rtti
    -Wno-stringop-overflow
    -fno-optimize-strlen
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=40960
    ; Day 70-71: Настройки brownout detector для предотвращения перезагрузок
    -DCONFIG_ESP32S3_BROWNOUT_DET=1
    -DCONFIG_ESP32S3_BROWNOUT_DET_LVL=7
    ; Оптимизация для уменьшения размера объектных файлов
    -fno-threadsafe-statics
    ; Игнорировать предупреждения о deprecated функциях (StaticJsonDocument)
    -Wno-deprecated-declarations
    ; TinyUSB configuration for USB HID Keyboard
    -DUSE_TINYUSB=1
    -DCONFIG_TINYUSB=1
    -DCONFIG_TINYUSB_HID_ENABLED=1

lib_deps = 
    ArduinoJson@^7.0.0
    ; USB Host библиотека для чтения клавиш с физической клавиатуры.
    ; EspUsbHost вкоммичена в lib/EspUsbHost (v1.0.2, MIT, © TANAKA Masayuki),
    ; посему внешние пути и локальные ссылки не требуются.

; Отключаем генерацию map файла (проблема с кириллицей в пути)
extra_scripts = post:scripts/disable_map.py

monitor_filters = esp32_exception_decoder
